name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
      VITE_ADSENSE_SLOT: ${{ vars.VITE_ADSENSE_SLOT }}
      VITE_ADSENSE_SLOT_TOP: ${{ vars.VITE_ADSENSE_SLOT_TOP }}
      VITE_ADSENSE_SLOT_INLINE: ${{ vars.VITE_ADSENSE_SLOT_INLINE }}
      VITE_ADSENSE_SLOT_BOTTOM: ${{ vars.VITE_ADSENSE_SLOT_BOTTOM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit